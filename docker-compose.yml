services:
  bot:
    build:
      context: .
    container_name: support-bot-ray
    command: sh -c "cd /usr/src/app && python -m app"
    restart: always
    depends_on:
      - redis
    volumes:
      - .:/usr/src/app
    networks:
      - support-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:alpine
    container_name: support-redis-ray
    restart: always
    volumes:
      - ./redis/data/:/data
    networks:
      - support-network

networks:
  support-network:
    name: support-network
    driver: bridge