services:
  bot:
    build:
      context: .
    container_name: support-bot-ray
    command: sh -c "cd /usr/src/app && python -m app"
    restart: always
    depends_on:
      - postgres
    volumes:
      - .:/usr/src/app
    networks:
      - support-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: postgres:16-alpine
    container_name: support-postgres-ray
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-support_bot}
      POSTGRES_USER: ${POSTGRES_USER:-bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bot_secret_password}
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    ports:
      - "54332:5432"
    networks:
      - support-network

networks:
  support-network:
    name: support-network
    driver: bridge
